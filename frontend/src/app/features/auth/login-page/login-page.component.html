<section class="card auth-card">
  <h1 class="auth-card__title">Welcome back</h1>
  <p class="auth-card__subtitle muted">Log in to manage your tickets.</p>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage(); as message) {
      <app-alert [message]="message" />
    }

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
      <app-form-field-error [control]="form.controls.email" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      <app-form-field-error [control]="form.controls.password" />
    </div>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="auth-card__footer muted">
    No account yet? <a [routerLink]="registerPath">Create one</a>
  </p>
</section>
