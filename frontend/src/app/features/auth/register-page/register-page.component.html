<section class="card auth-card">
  <h1 class="auth-card__title">Create an account</h1>
  <p class="auth-card__subtitle muted">Start tracking your tickets in seconds.</p>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage(); as message) {
      <app-alert [message]="message" />
    }

    <div class="form-field">
      <label for="name">Name</label>
      <input id="name" class="input" type="text" formControlName="name" autocomplete="name" />
      <app-form-field-error [control]="form.controls.name" />
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
      <app-form-field-error [control]="form.controls.email" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
      <app-form-field-error [control]="form.controls.password" />
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        class="input"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
      <app-form-field-error [control]="form.controls.confirmPassword" />
      @if (form.hasError(passwordMismatchError) && form.controls.confirmPassword.touched) {
        <p class="field-error" role="alert">Passwords do not match.</p>
      }
    </div>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="auth-card__footer muted">
    Already registered? <a [routerLink]="loginPath">Log in</a>
  </p>
</section>
